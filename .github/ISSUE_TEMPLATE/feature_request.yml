name: Feature Request
description: Suggest an idea or improvement for Aperture
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Before filing, it's worth a quick check of
        [ROADMAP.md](https://github.com/your-org/claude-code-labs/blob/main/ROADMAP.md)
        to see if something similar is already planned.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the underlying problem or use case, not just the solution you have in mind.
      placeholder: |
        I can't tell which specific skill's description is contributing the
        most eager tokens without drilling into the TUI manually every time.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like Aperture to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you thought about, and why they didn't fit.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Which area does this affect?
      options:
        - scan command
        - tui command
        - doctor command
        - diff command
        - init command
        - ContextSource plugin architecture
        - Config schema
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else — mockups, links, related issues.
    validations:
      required: false
