name: Bug Report
description: Report a problem with Aperture
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. The more detail you can
        provide, the faster this can get fixed.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
      placeholder: |
        `aperture scan` crashed with an error instead of printing a report.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact command(s) you ran, and any relevant config.
      placeholder: |
        1. `aperture init`
        2. Add a plugin to `aperture.config.json`
        3. Run `aperture scan`
        4. See error
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output or error message
      description: Paste the full error output. This will be rendered as a code block.
      render: shell
    validations:
      required: false

  - type: input
    id: aperture-version
    attributes:
      label: Aperture version
      description: Output of `aperture --version`
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`
      placeholder: "v20.11.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Linux
        - Windows
        - Other (specify in description)
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might help — config file contents (redact anything sensitive), scale of your `~/.claude` directory, etc.
    validations:
      required: false
