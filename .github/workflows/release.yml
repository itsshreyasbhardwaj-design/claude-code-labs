name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # This step opens a "Version Packages" PR when changesets are pending,
      # or publishes to npm (running the `release` script, e.g. `npm run build`
      # + `changeset publish`) once changesets have been merged into main.
      #
      # NOTE: NPM_TOKEN must be added as a repository secret
      # (Settings -> Secrets and variables -> Actions -> New repository secret)
      # before publishing will work. Until it's added, this job will still
      # open/update the Version Packages PR, but publishing will fail.
      - name: Create release PR or publish to npm
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1 (v1 is a moving branch ref, not a tag; SHA == v1.9.0 as resolved 2026-08-11)
        with:
          publish: npx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
